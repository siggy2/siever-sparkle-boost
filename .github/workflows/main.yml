# .github/workflows/deploy.yml
name: Deploy to FastName

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci  # or `npm install` if you're not using a lockfile

      - name: Build site with Vite
        run: npm run build  # must produce ./dist/ directory

      - name: List dist contents for debug
        run: ls -la ./dist

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@4.3.5
        with:
          server: ftp.fastname.no
          username: ${{ secrets.FASTNAME_USER }}
          password: ${{ secrets.FASTNAME_PASS }}
          local-dir: ./dist/  # ✅ must have trailing slash
